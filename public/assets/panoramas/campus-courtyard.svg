    <!-- Building A Exterior -->
    <rect x="80" y="150" width="440" height="370" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text x="300" y="230" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#E31B23" text-anchor="middle">КОРПУС А • ГЛАВНЫЙ</text>
    <text x="300" y="270" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#bae6fd" text-anchor="middle">ЭТАЖИ 1–3 • ЦЕНТРАЛЬНЫЙ ВХОД</text>
    <!-- Covered Walkway -->
    <rect x="680" y="280" width="440" height="240" rx="10" fill="url(#glass)" stroke="#e2e8f0" stroke-width="2"/>
    <text x="900" y="360" font-family="Arial, sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle">ПЕШЕХОДНАЯ АЛЛЕЯ МЕЖДУ КОРПУСАМИ</text>
    <!-- Building B Exterior -->
    <rect x="1280" y="175" width="440" height="345" rx="6" fill="#1e293b" stroke="#E31B23" stroke-width="3"/>
    <text x="1500" y="250" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle">КОРПУС B • КОНГРЕСС-ХОЛЛ</text>
    <text x="1500" y="290" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#fca5a5" text-anchor="middle">ЗАЛ МЕРОПРИЯТИЙ И ПРЕСС-ЦЕНТР</text>
