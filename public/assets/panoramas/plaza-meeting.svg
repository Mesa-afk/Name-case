    <!-- Big VCS Screen -->
    <rect x="110" y="250" width="380" height="210" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <text x="300" y="345" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#38bdf8" text-anchor="middle">ВКС ТТК • 4K DISPLAY</text>
    <text x="300" y="385" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#cbd5e1" text-anchor="middle">ПЕРЕГОВОРНАЯ «АЛЬФА» (3 ЭТАЖ)</text>
