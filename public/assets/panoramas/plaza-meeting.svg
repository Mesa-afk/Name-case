    <text x="900" y="275" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#e0f2fe" text-anchor="middle">ПАНОРАМНОЕ ОСТЕКЛЕНИЕ • ВИД НА ГОРОД</text>
